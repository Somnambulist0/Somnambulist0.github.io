    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],

                    },
                    // ==============================================
                    // 🎨 【配色控制台】在这里统一修改颜色
                    // ==============================================
                    colors: {
                        theme: {
                            primary: '#4F46E5',      // 核心强调色 (靛青色)，用于 Hover 和重点
                            primary_dark: '#3730A3', // 按钮深色态
                            text: '#111827',         // 主要文字颜色 (深黑)
                            subtext: '#6B7280',      // 次要文字颜色 (中灰)
                            border: '#E5E7EB',       // 边框颜色 (浅灰)
                            bg: '#FFFFFF',           // 页面背景色
                            surface: '#F9FAFB',      // 卡片/区块背景 (极淡灰)
                        }
                    }
                    // ==============================================
                }

        }

    <style>
        * {
            box-sizing: border-box;
        }
        
        html, body {
            overflow-x: hidden;
            width: 100%;
            max-width: 100%;
        }
        
        body {
            background-color: theme('colors.theme.bg');
            color: theme('colors.theme.text');
            margin: 0;
            padding: 0;
        }
        
        /* 顶部导航栏玻璃效果 */
        .glass-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid theme('colors.theme.border');
        }

        /* 高级链接样式 */
        .link-pro {
            color: theme('colors.theme.subtext');
            font-weight: 600;
            word-break: break-word;
            /* text-decoration: underline;
            text-decoration-color: theme('colors.theme.border');
            text-underline-offset: 3px; */
            transition: all 0.2s ease;
        }
        .link-pro:hover {
            color: theme('colors.theme.primary');
            text-decoration-color: theme('colors.theme.primary');
            background-color: #EEF2FF;
        }

        /* 卡片交互 */
        .paper-card {
            border: 1px solid theme('colors.theme.border');
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .paper-card:hover {
            border-color: theme('colors.theme.primary');
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }

        /* Abstract 动画 */
        details > summary { list-style: none; cursor: pointer; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] summary ~ * { animation: sweep .2s ease-in-out; }
        @keyframes sweep { 0% {opacity: 0; transform: translateY(-5px)} 100% {opacity: 1; transform: translateY(0)} }
    </style>
</head>
